# MySQL Database Configuration (for application data)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:35.232.167.9}/${MYSQL_DATABASE:otaku_ma}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Database Configuration (for Spring Batch metadata)
spring.batch.jdbc.url=jdbc:h2:mem:batchdb;DB_CLOSE_ON_EXIT=FALSE
spring.batch.jdbc.username=sa
spring.batch.jdbc.password=
spring.batch.jdbc.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=${SHOW_SQL:false}

# Batch Configuration
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=always

# Firestore Configuration
firestore.project-id=${FIRESTORE_PROJECT_ID:otakuma-221716}
firestore.credentials-path=${FIRESTORE_CREDENTIALS_PATH:otaku-221716-firebase-adminsdk-fbsvc-ea905684f7.json}

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Logging Configuration
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n
logging.level.org.springframework.batch=${BATCH_LOG_LEVEL:INFO}
logging.level.com.otakuma=${APP_LOG_LEVEL:INFO}