# MySQL Database Configuration (for application data)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Database Configuration (for Spring Batch metadata)
spring.batch.jdbc.url=jdbc:h2:mem:batchdb;DB_CLOSE_ON_EXIT=FALSE
spring.batch.jdbc.username=sa
spring.batch.jdbc.password=
spring.batch.jdbc.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Batch Configuration
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=always

# Batch Performance Configuration
batch.chunk-size=${BATCH_CHUNK_SIZE:10}
batch.thread-pool-size=${BATCH_THREAD_POOL_SIZE:4}
batch.max-thread-pool-size=${BATCH_MAX_THREAD_POOL_SIZE:8}

# Firestore Configuration
firestore.project-id=${FIRESTORE_PROJECT_ID}
firestore.credentials-path=${FIRESTORE_CREDENTIALS_PATH}

# Logging Configuration
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n