<ng-container *ngIf="openPopup" >
  <div class="modal" (click) = "closePopup()">

    <div class="modal-content" (click) = "handleClick($event)">
      <div class="modal-header">
        <span class="close" (click) = "closePopup()">&times;</span>
        
        <ng-container *ngIf="titre">
        <h4>{{titre}}</h4>
        </ng-container>
      </div>
      <div class="modal-body">
        <ng-container *ngIf="text1">
          
          <div class="row" style="margin: 5px 10px; vertical-align: middle">
            {{text1}}
            <ng-container *ngIf="image">
              <img src = "{{image}}" class="img-responsive variationimg"/>
            </ng-container>
          </div>
        </ng-container>
        <ng-container *ngIf="text2">
            <p>{{text2}}</p>
        </ng-container>
      </div>
      <div class="modal-footer">
        <ng-container *ngIf="buttonText">
          <Button class="btn panier" value="{{buttonText}}" (click)="buttonClick()">{{buttonText}}</Button>
        </ng-container>  
      </div>
    </div>
  </div>
</ng-container>
