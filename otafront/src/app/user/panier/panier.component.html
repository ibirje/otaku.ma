<div class="col-lg-offset-1 col-md-offset-1 col-lg-10 col-md-10 col-sm-12 col-xs-12" style="padding-top : 0;background-color: #3A6FFF">
  <span class=" size-titre" style="float: left; color:white">Panier ({{itemlist?.length > 0 ? itemlist?.length : 0}})</span>
</div>
<div class="col-lg-offset-1 col-md-offset-1 col-lg-10 col-md-10 col-sm-12 col-xs-12 round-border" style="padding-top : 0; padding-left: 10px; padding-right: 10px;">
    
  <div class="col-lg-offset-1 col-md-offset-1 col-sm-offset-1 col-xs-offset-1 col-lg-10 col-md-10 col-sm-10 col-xs-10 round-border totalprix">
    
    <div class="col-lg-5 col-md-5 col-sm-4 col-xs-4" style="padding : 10px 0">
        Quantité : <span class="prix size-sous-titre">{{quantiteTotale}}</span> <span class="prix"> pièce</span><span class="prix" *ngIf = "quantiteTotale > 1">s</span>
    </div>

    <div class="col-lg-5 col-md-5 col-sm-5 col-xs-4" style="padding :10px 0">
        Prix total : <span class="prix size-sous-titre">{{prixTotal}}</span><span class="prix"> DH</span>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-3 col-xs-4" style="padding : 5px 0">
      <button class="btn acheternow size-sous-titre" (click) = "acheterClick()">Acheter</button>
    </div>
  
  </div>
  <div *ngIf = "loading; else notLoading">
    <div style="margin: 0 5px">
      <div class=" col-md-offset-1 col-lg-offset-1 col-md-10 col-lg-10 col-sm-12 col-xs-12 round-border">
        <img src="../../../assets/img/kawai_loading.gif" title="{{nom}}"  alt="Chargement..." style="width: 20%" />
      </div>
    </div>
  </div>
  <ng-template #notLoading>
    <ng-container *ngIf ="itemlist?.length > 0 ; else listevide">
      <app-item 
        *ngFor = "let item of itemlist.slice().reverse()"
        [item] = "item"
        (selectionChangedEvent) = "onSelectionChanged()" 
        (deleteEvent) = "onDelete($event)"
        (achatEvent) = "acheterItemClick($event)">
      </app-item>
    </ng-container>
    <ng-template #listevide>
      <div *ngIf ="!erreur" class="col-lg-offset-1 col-md-offset-1 col-lg-10 col-md-10 col-sm-12 col-xs-12" style="margin-top : 60px; margin-bottom:90px">
        Panier vide.
      </div>
      <div *ngIf ="erreur" class="col-lg-offset-1 col-md-offset-1 col-lg-10 col-md-10 col-sm-12 col-xs-12" style="margin-top : 20px; margin-bottom:50px">
        {{erreur}}
      </div>
    </ng-template>

  </ng-template>
  

</div>
