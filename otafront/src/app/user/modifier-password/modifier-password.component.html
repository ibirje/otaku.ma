<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" >
    <a routerLink = "/"> <img src="../../assets/img/logo.png" alt="Otaku.ma" style="height: 50px; width:300px"/></a>
</div>

<div class="col-lg-offset-3 col-md-offset-3 col-sm-offset-2 col-xs-offset-1 col-lg-6 col-md-6 col-sm-8 col-xs-10 round-border">
  <div class="col-md-12" style="padding: 20px;">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" *ngIf ="!erreur">

      <div class="form-group">
        <label for="motdepasse">Mot de passe</label>
        <input type="password" formControlName="motdepasse" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.motdepasse.errors }" />
        <div *ngIf="submitted && f.motdepasse.errors" class="invalid-feedback">
            <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.motdepasse.errors.required">Mot de passe necessaire</div>
            <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.motdepasse.errors.minlength">Le mot de passe doit contenir aumoins 6 caractères</div>
        </div>
      </div>
    
      <div class="form-group">
        <label for="confirmpassword">Confirmez votre mot de passe</label>
        <input type="password" formControlName="confirmpassword" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.confirmpassword.errors }" />
        
        <div *ngIf="submitted && f.confirmpassword.errors" class="invalid-feedback">
            <div role="alert" *ngIf="f.confirmpassword.errors.required" class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" >Mot de passe necessaire</div>
            <div role="alert" *ngIf="f.confirmpassword.errors.minlength" class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" >Le mot de passe doit contenir aumoins 6 caractères</div>
        </div>
        <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="submitted && registerForm.hasError('notSame')">La confirmation et le mot de passe sont différents  </div>
      </div>
          
      <div class="form-group">
        <button [disabled]="loading" class="btn btn-primary">Envoyer</button>
      </div>
    </form>
    <div class="alert alert-success" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf ="erreur">
      <p *ngIf = "erreur === 'expire'">Lien de modification invalide ou expiré.</p>
      <p *ngIf = "erreur === 'invalide'">Lien de modification invalide ou expiré.</p>
    </div>
  </div>
</div>
<!-- rename to recup password -->
