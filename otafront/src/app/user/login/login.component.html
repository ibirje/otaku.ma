<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" >
    <a routerLink = "/"> <img src="../../assets/img/logo.png" alt="Otaku.ma" style="height: 50px; width:300px"/></a>
</div>

<div class="col-lg-offset-3 col-md-offset-3 col-sm-offset-2 col-xs-offset-1 col-lg-6 col-md-6 col-sm-8 col-xs-10 round-border">
	<div class="col-md-12" style="padding: 20px;">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group">
                <label for="username" >Email ou pseudo</label>
                <input type="text" formControlName="username" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.username.errors }" />
                <div *ngIf="submitted && f.username.errors" class="invalid-feedback">
                    <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.username.errors.required">Email ou pseudo necessaire</div>
                    <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.username.errors.mailNonConfirme">Adresse email non confirmée</div>
                    <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.username.errors.email">n'est pas une adresse email valide ( ex : example@gmail.com )</div>
                    <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.username.errors.nonInscrit">Non inscrit</div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
                <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                    <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.password.errors.required">Mot de passe necessaire</div>
                    <div class="alert alert-danger" style="margin:10px 0; padding:5px 15px;" role="alert" *ngIf="f.password.errors.notFound">Pseudo ou mot de passe erronés</div>
                </div>
            </div>

            <div class="form-group">
                <button [disabled]="loading" class="btn btn-primary">Connecter</button>
            </div>

            <div class="form-group">
                <a style="color:blue; margin-right: 10px;" rel="noopener" target="_blank" href = "https://www.facebook.com/Boutique.Otaku/">
                    Connecter avec facebook 
                    <button class="footbutton" style="border:none;margin:0 20px 0 0">
                        <img alt="facebook" src="../../assets/img/facebook_icon.png" style="width:32px;height:32px">	
                    </button>
                </a>    
                <a routerLink = "/user/recupererLogin" style="color: blue">
                    Mot de passe oublié ?
                </a>
            </div>

            <div class="form-group">
                <span >Pas encore inscrit ?</span> 
                <a style="color:blue" routerLink = "/user/inscription">
                    Inscriver-vous gratuitement
                </a>
            </div>
            
        </form>
    </div>
</div>
